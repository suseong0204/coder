<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>DJMAX Style Rhythm Game</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 0;
      background: #08090d; color: #fff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex; justify-content: center; align-items: center;
      height: 100vh; overflow: hidden;
    }
    #game-container {
      position: relative; width: 420px; height: 680px;
      box-shadow: 0 0 40px rgba(0, 210, 255, 0.4);
      border-left: 2px solid rgba(0, 210, 255, 0.6);
      border-right: 2px solid rgba(0, 210, 255, 0.6);
      background: #0d0f18; overflow: hidden;
    }
    #gameCanvas { position: absolute; top: 0; left: 0; z-index: 1; }

    /* 라이프 게이지 바 */
    .hp-bar-container {
      position: absolute; top: 12px; right: 12px; z-index: 5;
      width: 140px; height: 16px; background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(0, 210, 255, 0.8); border-radius: 8px;
      overflow: hidden; padding: 2px;
    }
    .hp-bar-fill {
      width: 100%; height: 100%;
      background: linear-gradient(90deg, #ff0055, #00ff88);
      border-radius: 6px; transition: width 0.1s linear;
    }

    /* 좌측 상단 일시정지 버튼 */
    .pause-btn {
      position: absolute; top: 12px; left: 12px; z-index: 5;
      background: rgba(13, 15, 24, 0.8); border: 1px solid rgba(0, 210, 255, 0.6);
      color: #00ffff; width: 38px; height: 38px; border-radius: 50%;
      font-size: 15px; cursor: pointer; display: none;
      box-shadow: 0 0 10px rgba(0, 210, 255, 0.3); transition: all 0.2s;
    }
    .pause-btn:hover {
      background: rgba(0, 210, 255, 0.3); transform: scale(1.1);
    }

    /* 공통 오버레이 레이아웃 */
    .overlay {
      position: absolute; top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(10, 12, 22, 0.95); z-index: 10;
      display: flex; flex-direction: column;
      justify-content: center; align-items: center;
      text-align: center; padding: 24px;
    }

    .title {
      font-size: 28px; font-weight: 900; color: #00ffff;
      text-shadow: 0 0 15px rgba(0, 255, 255, 0.7); margin-bottom: 20px;
    }

    /* 곡 선택 카드 스타일 */
    .song-list { width: 100%; display: flex; flex-direction: column; gap: 12px; margin-bottom: 20px; }
    .song-card {
      background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(0, 210, 255, 0.3);
      border-radius: 10px; padding: 14px; cursor: pointer;
      display: flex; justify-content: space-between; align-items: center;
      transition: all 0.2s;
    }
    .song-card:hover, .song-card.active {
      background: rgba(0, 210, 255, 0.15); border-color: #00ffff;
      transform: translateY(-2px);
    }
    .song-info-left { text-align: left; }
    .song-title { font-size: 15px; font-weight: bold; color: #fff; }
    .song-sub { font-size: 12px; color: #aaa; margin-top: 4px; }
    
    .best-score-tag {
      font-size: 11px; font-weight: bold; color: #00ffff;
      background: rgba(0, 255, 255, 0.1); border: 1px solid #00ffff;
      padding: 4px 8px; border-radius: 6px; white-space: nowrap; text-align: right;
    }

    /* 버튼 스타일 */
    .btn {
      background: linear-gradient(45deg, #00d2ff, #0072ff);
      border: none; color: white; padding: 12px 36px;
      font-size: 16px; font-weight: bold; border-radius: 30px;
      cursor: pointer; box-shadow: 0 0 20px rgba(0, 210, 255, 0.5);
      transition: transform 0.2s; margin-top: 8px;
    }
    .btn:hover { transform: scale(1.05); }
    .btn-danger {
      background: linear-gradient(45deg, #ff416c, #ff4b2b);
      box-shadow: 0 0 20px rgba(255, 65, 108, 0.5);
    }

    /* 결과 및 최고 기록 이름 입력 창 */
    .result-score { font-size: 34px; color: #00ffff; font-weight: bold; margin: 10px 0; }
    .result-detail { font-size: 15px; color: #ccc; margin-bottom: 15px; }
    .new-record-banner {
      color: #ffcc00; font-weight: bold; font-size: 16px;
      margin-bottom: 8px; display: none; text-shadow: 0 0 10px rgba(255, 204, 0, 0.8);
    }
    .name-input-box {
      display: none; flex-direction: column; align-items: center; gap: 8px;
      background: rgba(255, 204, 0, 0.1); border: 1px solid #ffcc00;
      padding: 12px; border-radius: 10px; margin-bottom: 15px; width: 100%;
    }
    .name-input-box input {
      padding: 8px 12px; border-radius: 20px; border: 1px solid #00ffff;
      background: #0d0f18; color: #fff; text-align: center; font-size: 14px;
      outline: none; width: 80%;
    }
  </style>
</head>
<body>

<div id="game-container">
  <!-- Audio Tag -->
  <audio id="bgm" preload="auto"></audio>

  <!-- UI Elements (HP Bar, Pause Button) -->
  <div class="hp-bar-container" id="hpContainer" style="display: none;">
    <div id="hpFill" class="hp-bar-fill"></div>
  </div>
  <button id="pauseBtn" class="pause-btn" onclick="pauseGame()">⏸</button>
  <canvas id="gameCanvas" width="420" height="680"></canvas>

  <!-- 1. 메인 메뉴 -->
  <div id="menu-overlay" class="overlay">
    <div class="title">SELECT SONG</div>
    <div id="songListContainer" class="song-list"></div>
    <button class="btn" onclick="startGame()">START GAME</button>
  </div>

  <!-- 2. 일시정지 메뉴 -->
  <div id="pause-overlay" class="overlay" style="display: none;">
    <div class="title" style="color: #ffcc00;">PAUSED</div>
    <button class="btn" onclick="resumeGame()" style="margin-bottom: 12px;">RESUME</button>
    <button class="btn btn-danger" onclick="quitToMenu()">MAIN MENU</button>
  </div>

  <!-- 3. 스테이지 결과 화면 (성공 / 실패 공용) -->
  <div id="result-overlay" class="overlay" style="display: none;">
    <div id="resultTitle" class="title" style="color: #00ff88;">STAGE CLEAR!</div>
    <div id="newRecordTag" class="new-record-banner">★ NEW HIGH SCORE! ★</div>
    
    <!-- 최고기록 달성 시 이름 입력 상자 -->
    <div id="nameInputBox" class="name-input-box">
      <div style="font-size: 13px; color: #ffcc00; font-weight: bold;">최고 기록 달성! 이름을 남겨주세요:</div>
      <input type="text" id="playerNameInput" maxlength="8" placeholder="플레이어 이름 (최대 8자)">
      <button class="btn" style="padding: 6px 18px; font-size: 12px;" onclick="submitHighScoreName()">기록 저장</button>
    </div>

    <div>FINAL SCORE</div>
    <div class="result-score" id="resScore">0000000</div>
    <div class="result-detail" id="resCombo">MAX COMBO: 0</div>
    <button class="btn" onclick="showMenu()">MAIN MENU</button>
  </div>
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const audio = document.getElementById('bgm');

// UI Elements
const menuOverlay = document.getElementById('menu-overlay');
const pauseOverlay = document.getElementById('pause-overlay');
const resultOverlay = document.getElementById('result-overlay');
const songListContainer = document.getElementById('songListContainer');
const pauseBtn = document.getElementById('pauseBtn');
const hpContainer = document.getElementById('hpContainer');
const hpFill = document.getElementById('hpFill');
const nameInputBox = document.getElementById('nameInputBox');
const playerNameInput = document.getElementById('playerNameInput');

let playlist = [
  { 
    id: "gangnam", 
    title: "강남스타일", 
    artist: "PSY", 
    src: "assets/gangnamstyle.mp3", 
    bpm: 132, 
    verseDuration: 100, 
    displayTime: "1분 40초"
  },
  { 
    id: "majimak", 
    title: "마지막처럼", 
    artist: "BLACKPINK", 
    src: "assets/majimak.mp3", 
    bpm: 125, 
    verseDuration: 95, 
    displayTime: "1분 35초"
  },
  { 
    id: "fire", 
    title: "불타오르네", 
    artist: "BTS", 
    src: "assets/fire.mp3", 
    bpm: 140, 
    verseDuration: 87, 
    displayTime: "1분 27초"
  }
];

let selectedSongIndex = 0;

const LANES = 4;
const KEYS = ['d', 'f', 'j', 'k'];
const KEY_LABELS = ['D', 'F', 'J', 'K'];
const LANE_WIDTH = canvas.width / LANES;
const JUDGMENT_Y = 570;
const NOTE_HEIGHT = 18;
const NOTE_SPEED = 550;

// 게임 상태 변수
let isGameRunning = false;
let isGamePaused = false;
let isCountingDown = false;
let countdownVal = 3;
let currentPlayDuration = 85;
let pauseStartTime = 0;
let startTime = 0;
let score = 0;
let combo = 0;
let maxCombo = 0;
let lastJudgement = { text: '', color: '#fff', alpha: 0 };
const keyPressed = [false, false, false, false];
let chart = [];

// ★ 추가된 라이프 시스템 변수 ★
let hp = 100;
const MAX_HP = 100;
const MISS_DAMAGE = 15; // 놓쳤을 때 감점되는 라이프
const HEAL_AMOUNT = 2;   // 성공 시 회복되는 라이프

function updateHpBar() {
  const percent = Math.max(0, (hp / MAX_HP) * 100);
  hpFill.style.width = percent + '%';
}

// 스토리지 최고점수 및 이름 관리
function getHighScoreData(songId) {
  const score = parseInt(localStorage.getItem(`rhythm_best_score_${songId}`) || '0', 10);
  const name = localStorage.getItem(`rhythm_best_name_${songId}`) || 'NONE';
  return { score, name };
}

function saveHighScoreScore(songId, newScore) {
  const currentData = getHighScoreData(songId);
  if (newScore > currentData.score) {
    localStorage.setItem(`rhythm_best_score_${songId}`, newScore);
    return true;
  }
  return false;
}

function submitHighScoreName() {
  const song = playlist[selectedSongIndex];
  const inputName = playerNameInput.value.trim() || 'UNKNOWN';
  localStorage.setItem(`rhythm_best_name_${song.id}`, inputName);
  nameInputBox.style.display = 'none';
  renderSongList();
}

function renderSongList() {
  songListContainer.innerHTML = '';
  playlist.forEach((song, index) => {
    const bestData = getHighScoreData(song.id);
    const formattedBest = bestData.score.toString().padStart(7, '0');
    
    const card = document.createElement('div');
    card.className = `song-card ${index === selectedSongIndex ? 'active' : ''}`;
    card.onclick = () => selectSong(index);
    
    card.innerHTML = `
      <div class="song-info-left">
        <div class="song-title">${song.title}</div>
        <div class="song-sub">${song.artist} | BPM ${song.bpm} (1절: ${song.displayTime})</div>
      </div>
      <div class="best-score-tag">
        👑 ${bestData.name}<br>BEST: ${formattedBest}
      </div>
    `;
    songListContainer.appendChild(card);
  });
}

function selectSong(index) {
  selectedSongIndex = index;
  renderSongList();
}

// 곡별 전용 노트 패턴 생성기
function buildChart(song, totalDurationSec) {
  const chartData = [];
  const bpm = song.bpm;
  const beatTime = 60 / bpm;
  const startOffset = 2.0;
  const laneBusyUntil = [0, 0, 0, 0];
  const totalMeasures = Math.floor((totalDurationSec - startOffset - 2.0) / (beatTime * 4));

  function addTap(lane, t, gap = 0.15) {
    if (laneBusyUntil[lane] <= t) {
      chartData.push({ type: 'tap', lane, targetTime: t, hit: false, missed: false });
      laneBusyUntil[lane] = t + gap;
      return true;
    }
    return false;
  }

  function addHold(lane, t, duration, gap = 0.2) {
    if (laneBusyUntil[lane] <= t) {
      const endT = t + duration;
      chartData.push({ type: 'hold', lane, targetTime: t, endTime: endT, state: 'NONE', holdTicks: 0 });
      laneBusyUntil[lane] = endT + gap;
      return true;
    }
    return false;
  }

  for (let m = 0; m < totalMeasures; m++) {
    const measureStart = startOffset + m * 4 * beatTime;
    const progress = m / totalMeasures;

    if (song.id === 'gangnam') {
      const section = progress < 0.15 ? 'intro'
        : progress < 0.45 ? 'verse'
        : progress < 0.55 ? 'build'
        : progress < 0.9 ? 'chorus'
        : 'outro';

      if (section === 'intro') {
        for (let step = 0; step < 4; step++) {
          addTap((m + step) % 4, measureStart + step * beatTime);
        }
      } else if (section === 'verse') {
        for (let step = 0; step < 8; step++) {
          if (step % 2 === 0) addTap((m + step / 2) % 4, measureStart + step * (beatTime / 2));
        }
        if (m % 2 === 1) addTap((m + 3) % 4, measureStart + 3.5 * beatTime, 0.1);
      } else if (section === 'build') {
        for (let step = 0; step < 8; step++) {
          addTap((m + step) % 4, measureStart + step * (beatTime / 2), 0.1);
        }
      } else if (section === 'chorus') {
        for (let step = 0; step < 8; step++) {
          const t = measureStart + step * (beatTime / 2);
          if (step % 4 === 0) {
            const lane = (m + step) % 4;
            addTap(lane, t, 0.1);
            addTap((lane + 2) % 4, t, 0.1);
          } else if (step % 2 === 1) {
            addTap((m + step) % 4, t, 0.1);
          }
        }
      } else {
        for (let step = 0; step < 4; step++) {
          addTap((m + step) % 4, measureStart + step * beatTime);
        }
      }
    }
    else if (song.id === 'majimak') {
      const section = progress < 0.2 ? 'verse1'
        : progress < 0.35 ? 'prechorus'
        : progress < 0.7 ? 'chorus'
        : progress < 0.85 ? 'verse2'
        : 'outro';

      if (section === 'verse1' || section === 'verse2') {
        for (let step = 0; step < 8; step++) {
          if (step % 2 === 1) addTap((m + step) % 4, measureStart + step * (beatTime / 2));
        }
      } else if (section === 'prechorus') {
        const lane = m % 4;
        addHold(lane, measureStart, beatTime * 3, 0.2);
        addTap((lane + 2) % 4, measureStart + 3.5 * beatTime, 0.1);
      } else if (section === 'chorus') {
        if (m % 2 === 0) {
          addHold(m % 4, measureStart, beatTime * 2, 0.15);
          for (let step = 4; step < 8; step++) {
            addTap((step + m) % 4, measureStart + step * (beatTime / 2), 0.1);
          }
        } else {
          for (let step = 0; step < 8; step++) {
            if (step % 2 === 0) addTap((step / 2 + m) % 4, measureStart + step * (beatTime / 2), 0.1);
          }
        }
      } else {
        addHold(m % 4, measureStart, beatTime * 4, 0.2);
      }
    }
    else if (song.id === 'fire') {
      const section = progress < 0.15 ? 'intro'
        : progress < 0.4 ? 'verse'
        : progress < 0.55 ? 'build'
        : progress < 0.9 ? 'chorus'
        : 'outro';
      const streamPattern = [0, 1, 2, 3, 2, 1, 0, 3];

      if (section === 'intro') {
        for (let step = 0; step < 4; step++) {
          addTap((m + step) % 4, measureStart + step * beatTime, 0.12);
        }
      } else if (section === 'verse') {
        for (let step = 0; step < 8; step++) {
          const t = measureStart + step * (beatTime / 2);
          const lane = (streamPattern[step] + m) % 4;
          if (step % 2 === 0) addTap(lane, t, 0.12);
        }
      } else if (section === 'build' || section === 'chorus') {
        for (let step = 0; step < 8; step++) {
          const t = measureStart + step * (beatTime / 2);
          const lane = (streamPattern[step] + m) % 4;
          addTap(lane, t, 0.1);
          if (step === 0 && section === 'chorus' && m % 4 === 3) {
            addTap((lane + 2) % 4, t, 0.1);
          }
        }
      } else {
        for (let step = 0; step < 4; step++) {
          addTap((m + step) % 4, measureStart + step * beatTime, 0.15);
        }
      }
    }
  }

  chartData.sort((a, b) => a.targetTime - b.targetTime);
  return chartData;
}

// 게임 흐름 제어
function startGame() {
  menuOverlay.style.display = 'none';
  resultOverlay.style.display = 'none';
  pauseOverlay.style.display = 'none';

  const song = playlist[selectedSongIndex];
  score = 0; combo = 0; maxCombo = 0;
  hp = MAX_HP; // 라이프 초기화
  updateHpBar();

  isGamePaused = false;
  isCountingDown = false;

  audio.src = song.src;
  audio.currentTime = 0;

  audio.play().then(() => {
    currentPlayDuration = song.verseDuration; 
    chart = buildChart(song, currentPlayDuration);
    startTime = performance.now();
    isGameRunning = true;
    pauseBtn.style.display = 'block';
    hpContainer.style.display = 'block';
    requestAnimationFrame(gameLoop);
  }).catch(() => {
    alert(`음악 파일 재생 실패: ${song.src} 경로를 확인해주세요.`);
  });
}

function pauseGame() {
  if (!isGameRunning || isGamePaused || isCountingDown) return;
  isGamePaused = true;
  pauseStartTime = performance.now();
  audio.pause();
  pauseOverlay.style.display = 'flex';
}

function resumeGame() {
  if (!isGameRunning || !isGamePaused || isCountingDown) return;
  
  pauseOverlay.style.display = 'none';
  isCountingDown = true;
  countdownVal = 3;

  requestAnimationFrame(gameLoop);

  const timer = setInterval(() => {
    countdownVal--;
    if (countdownVal <= 0) {
      clearInterval(timer);
      const pausedDuration = performance.now() - pauseStartTime;
      startTime += pausedDuration;
      isCountingDown = false;
      isGamePaused = false;
      audio.play();
    }
  }, 1000);
}

function quitToMenu() {
  isGameRunning = false;
  isGamePaused = false;
  isCountingDown = false;
  audio.pause();
  pauseOverlay.style.display = 'none';
  showMenu();
}

// 스테이지 종료 (클리어 또는 실패)
function endGame(isFailed = false) {
  isGameRunning = false;
  isGamePaused = false;
  isCountingDown = false;
  pauseBtn.style.display = 'none';
  hpContainer.style.display = 'none';
  audio.pause();

  const song = playlist[selectedSongIndex];
  const resultTitle = document.getElementById('resultTitle');

  if (isFailed) {
    // 실패(Game Over) 처리
    resultTitle.innerText = "STAGE FAILED";
    resultTitle.style.color = "#ff0055";
    document.getElementById('newRecordTag').style.display = 'none';
    nameInputBox.style.display = 'none';
  } else {
    // 성공(Clear) 처리
    resultTitle.innerText = "STAGE CLEAR!";
    resultTitle.style.color = "#00ff88";

    const isNewRecord = saveHighScoreScore(song.id, score);
    if (isNewRecord) {
      document.getElementById('newRecordTag').style.display = 'block';
      playerNameInput.value = '';
      nameInputBox.style.display = 'flex';
    } else {
      document.getElementById('newRecordTag').style.display = 'none';
      nameInputBox.style.display = 'none';
    }
  }

  document.getElementById('resScore').innerText = score.toString().padStart(7, '0');
  document.getElementById('resCombo').innerText = `MAX COMBO: ${maxCombo}`;
  
  resultOverlay.style.display = 'flex';
}

function showMenu() {
  resultOverlay.style.display = 'none';
  pauseBtn.style.display = 'none';
  hpContainer.style.display = 'none';
  renderSongList();
  menuOverlay.style.display = 'flex';
  ctx.clearRect(0, 0, canvas.width, canvas.height);
}

// 키 입력 처리
window.addEventListener('keydown', (e) => {
  if (e.repeat || !isGameRunning || isGamePaused || isCountingDown) return;
  const lane = KEYS.indexOf(e.key.toLowerCase());
  if (lane !== -1) {
    keyPressed[lane] = true;
    checkKeyPress(lane);
  }
});

window.addEventListener('keyup', (e) => {
  if (!isGameRunning || isGamePaused || isCountingDown) return;
  const lane = KEYS.indexOf(e.key.toLowerCase());
  if (lane !== -1) {
    keyPressed[lane] = false;
    checkKeyRelease(lane);
  }
});

function checkKeyPress(lane) {
  const currentTime = (performance.now() - startTime) / 1000;
  const note = chart.find(n => n.lane === lane && 
    ((n.type === 'tap' && !n.hit && !n.missed) || (n.type === 'hold' && n.state === 'NONE')));

  if (!note) return;
  const timeDiff = Math.abs(currentTime - note.targetTime);

  if (note.type === 'tap') {
    if (timeDiff <= 0.05) { setJudgement('PERFECT', '#00ffff', 1000); note.hit = true; }
    else if (timeDiff <= 0.09) { setJudgement('GREAT', '#00ff88', 800); note.hit = true; }
    else if (timeDiff <= 0.14) { setJudgement('GOOD', '#ffbb00', 500); note.hit = true; }
    else if (timeDiff <= 0.19) { setJudgement('BREAK', '#ff0055', 0, true); note.missed = true; }
  } else if (note.type === 'hold') {
    if (timeDiff <= 0.15) { setJudgement('HOLD START!', '#00ffff', 500); note.state = 'HOLDING'; }
    else if (timeDiff <= 0.22) { setJudgement('BREAK', '#ff0055', 0, true); note.state = 'MISSED'; }
  }
}

function checkKeyRelease(lane) {
  const currentTime = (performance.now() - startTime) / 1000;
  const holdingNote = chart.find(n => n.lane === lane && n.type === 'hold' && n.state === 'HOLDING');
  if (!holdingNote) return;

  if (holdingNote.endTime - currentTime > 0.15) {
    holdingNote.state = 'MISSED'; setJudgement('BREAK', '#ff0055', 0, true);
  } else {
    holdingNote.state = 'COMPLETED'; setJudgement('PERFECT!', '#00ffff', 1000);
  }
}

function setJudgement(text, color, addedScore, isBreak = false) {
  lastJudgement = { text, color, alpha: 1.0 };
  if (isBreak) {
    combo = 0;
    // ★ BREAK 발생 시 라이프 차감 ★
    hp -= MISS_DAMAGE;
    if (hp <= 0) {
      hp = 0;
      updateHpBar();
      endGame(true); // 실패 상태로 게임 종료
      return;
    }
  } else {
    combo++; if (combo > maxCombo) maxCombo = combo;
    score += addedScore + combo * 10;
    
    // ★ 노트를 맞추면 라이프 소량 회복 ★
    hp = Math.min(MAX_HP, hp + HEAL_AMOUNT);
  }
  updateHpBar();
}

// 메인 렌더링 루프
function gameLoop(now) {
  if (!isGameRunning) return;
  if (isGamePaused && !isCountingDown) return;

  const currentTime = isCountingDown 
    ? (pauseStartTime - startTime) / 1000 
    : (now - startTime) / 1000;

  if (!isCountingDown && (audio.ended || currentTime >= currentPlayDuration || audio.currentTime >= currentPlayDuration)) {
    endGame(false); // 완곡 성공
    return;
  }

  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.fillStyle = '#0d0f18';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  for (let i = 0; i < LANES; i++) {
    const x = i * LANE_WIDTH;
    ctx.strokeStyle = 'rgba(255, 255, 255, 0.1)';
    ctx.strokeRect(x, 0, LANE_WIDTH, canvas.height);

    if (keyPressed[i]) {
      const gradient = ctx.createLinearGradient(0, JUDGMENT_Y - 180, 0, JUDGMENT_Y);
      gradient.addColorStop(0, 'rgba(0, 210, 255, 0)');
      gradient.addColorStop(1, 'rgba(0, 210, 255, 0.45)');
      ctx.fillStyle = gradient; ctx.fillRect(x, 0, LANE_WIDTH, JUDGMENT_Y);
      ctx.fillStyle = '#00d2ff'; ctx.fillRect(x, JUDGMENT_Y, LANE_WIDTH, canvas.height - JUDGMENT_Y);
    }
    ctx.fillStyle = keyPressed[i] ? '#ffffff' : '#666d8e';
    ctx.font = 'bold 22px sans-serif'; ctx.textAlign = 'center';
    ctx.fillText(KEY_LABELS[i], x + LANE_WIDTH / 2, canvas.height - 25);
  }

  ctx.shadowBlur = 12; ctx.shadowColor = '#00ffff'; ctx.strokeStyle = '#00ffff'; ctx.lineWidth = 4;
  ctx.beginPath(); ctx.moveTo(0, JUDGMENT_Y); ctx.lineTo(canvas.width, JUDGMENT_Y); ctx.stroke(); ctx.shadowBlur = 0;

  chart.forEach(note => {
    const x = note.lane * LANE_WIDTH;

    if (note.type === 'tap') {
      if (note.hit) return;
      const noteY = JUDGMENT_Y - (note.targetTime - currentTime) * NOTE_SPEED;

      if (!isCountingDown && !note.missed && currentTime - note.targetTime > 0.18) {
        note.missed = true; setJudgement('BREAK', '#ff0055', 0, true);
      }
      if (noteY > -NOTE_HEIGHT && noteY < canvas.height && !note.missed) {
        ctx.fillStyle = (note.lane === 1 || note.lane === 2) ? '#56ccf2' : '#2f80ed';
        ctx.fillRect(x + 5, noteY - NOTE_HEIGHT, LANE_WIDTH - 10, NOTE_HEIGHT);
        ctx.fillStyle = '#ffffff'; ctx.fillRect(x + 5, noteY - NOTE_HEIGHT, LANE_WIDTH - 10, 3);
      }
    } 
    else if (note.type === 'hold') {
      if (note.state === 'COMPLETED') return;
      let startY = JUDGMENT_Y - (note.targetTime - currentTime) * NOTE_SPEED;
      let endY = JUDGMENT_Y - (note.endTime - currentTime) * NOTE_SPEED;

      if (!isCountingDown && note.state === 'NONE' && currentTime - note.targetTime > 0.20) {
        note.state = 'MISSED'; setJudgement('BREAK', '#ff0055', 0, true);
      }
      if (!isCountingDown && note.state === 'HOLDING') {
        startY = JUDGMENT_Y;
        note.holdTicks++;
        if (note.holdTicks % 12 === 0) { score += 150; combo++; if (combo > maxCombo) maxCombo = combo; }
        if (currentTime >= note.endTime) { note.state = 'COMPLETED'; setJudgement('PERFECT!', '#00ffff', 800); return; }
        if (!keyPressed[note.lane]) checkKeyRelease(note.lane);
      }

      if (startY > -50 && endY < canvas.height && note.state !== 'MISSED') {
        const bodyHeight = startY - endY;
        const holdGradient = ctx.createLinearGradient(0, endY, 0, startY);
        holdGradient.addColorStop(0, 'rgba(255, 230, 0, 0.85)');
        holdGradient.addColorStop(1, 'rgba(255, 120, 0, 0.85)');
        ctx.fillStyle = holdGradient; ctx.fillRect(x + 12, endY, LANE_WIDTH - 24, bodyHeight);
        ctx.fillStyle = '#ffcc00'; ctx.fillRect(x + 5, startY - NOTE_HEIGHT, LANE_WIDTH - 10, NOTE_HEIGHT);
      }
    }
  });

  ctx.fillStyle = '#ffffff'; ctx.font = 'bold 16px monospace'; ctx.textAlign = 'left';
  ctx.fillText(`SCORE: ${score.toString().padStart(7, '0')}`, 15, 30);

  if (combo > 1) {
    ctx.textAlign = 'center'; ctx.fillStyle = '#00ffff'; ctx.font = 'bold 38px sans-serif';
    ctx.fillText(combo, canvas.width / 2, 260);
    ctx.font = 'bold 13px sans-serif'; ctx.fillStyle = '#ffffff';
    ctx.fillText('COMBO', canvas.width / 2, 280);
  }

  if (lastJudgement.alpha > 0) {
    ctx.textAlign = 'center'; ctx.fillStyle = lastJudgement.color;
    ctx.globalAlpha = lastJudgement.alpha; ctx.font = 'italic bold 28px sans-serif';
    ctx.fillText(lastJudgement.text, canvas.width / 2, 335);
    ctx.globalAlpha = 1.0; lastJudgement.alpha -= 0.02;
  }

  if (isCountingDown) {
    ctx.fillStyle = 'rgba(0, 0, 0, 0.5)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.textAlign = 'center';
    ctx.fillStyle = '#00ffff';
    ctx.font = '900 90px sans-serif';
    ctx.shadowBlur = 25;
    ctx.shadowColor = '#00ffff';
    ctx.fillText(countdownVal, canvas.width / 2, canvas.height / 2 + 30);
    ctx.shadowBlur = 0;
  }

  requestAnimationFrame(gameLoop);
}

renderSongList();
</script>
